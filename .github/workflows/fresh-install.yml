name: fresh-install
# Installs LimitBar on a brand-new GitHub-hosted Mac exactly as the README says, then installs real CLIs
# without signing in. Proves: the published command works on a machine that has never seen this repo,
# every CLI starts as "missing", and freshly installed, signed-out CLIs read "signedOut".
on:
  workflow_dispatch:
    inputs:
      install_commit:
        description: "commit whose install.sh to run (the one in the README)"
        required: true
permissions:
  contents: read

jobs:
  fresh:
    runs-on: macos-15
    steps:
      - name: install exactly as the README says
        env:
          INSTALL_COMMIT: ${{ inputs.install_commit }}
        run: |
          [[ "$INSTALL_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "install_commit must be a full commit SHA"; exit 1; }
          d="$(mktemp -d)" && echo "D=$d" >> "$GITHUB_ENV"
          curl -fsSLo "$d/install.sh" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$INSTALL_COMMIT/install.sh"
          bash "$d/install.sh"
          test -d ~/Applications/LimitBar.app
      - name: nothing installed yet → all four "missing"
        run: |
          ~/Applications/LimitBar.app/Contents/MacOS/LimitBar --probe | tee p1.json
          /usr/bin/python3 -c 'import json; d=json.load(open("p1.json")); s={k:v["state"] for k,v in d.items()}; print(s); assert set(s.values())=={"missing"}, s'
      - name: reinstall with the GitHub CLI signed in → build provenance must be verified too
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash "$D/install.sh" | tee reinstall.log
          grep -q "Build provenance verified" reinstall.log
      - name: install real CLIs, do not sign in
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          npm install -g @openai/codex
          ls -l ~/.local/bin/claude "$(command -v codex)"
      - name: claude isolation canary on a fresh Claude Code (hooks and MCP must not fire under LimitBar's flags)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          curl -fsSLo canary.sh "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/${{ github.sha }}/tests/claude-canary.sh"
          bash canary.sh
      - name: freshly installed CLIs → "signedOut", the rest "missing"
        run: |
          ~/Applications/LimitBar.app/Contents/MacOS/LimitBar --probe | tee p2.json
          /usr/bin/python3 -c 'import json; d=json.load(open("p2.json")); s={k:v["state"] for k,v in d.items()}; print(s); assert s["claude"]=="signedOut" and s["codex"]=="signedOut", s; assert s["gemini"]=="missing" and s["grok"]=="missing", s'
      - name: uninstall leaves nothing behind
        run: |
          bash "$D/install.sh" --uninstall
          test ! -e ~/Applications/LimitBar.app && test ! -e ~/Library/Caches/limitbar
