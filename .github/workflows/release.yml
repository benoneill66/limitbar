name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15          # GitHub-hosted only; install.sh rejects builds from self-hosted runners
    permissions:
      contents: write          # create the release
      id-token: write          # sign the build provenance (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tag must match VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - run: scripts/build-app.sh build --universal
      - run: tests/states.sh build/LimitBar.app
      - name: zip
        run: |
          ditto -c -k --keepParent build/LimitBar.app "LimitBar-$(cat VERSION).zip"
          shasum -a 256 "LimitBar-$(cat VERSION).zip" | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: LimitBar-*.zip
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "LimitBar-$(cat VERSION).zip" SHA256SUMS \
            --title "LimitBar $(cat VERSION)" \
            --notes "Built from commit $GITHUB_SHA by .github/workflows/release.yml on a GitHub-hosted runner. SHA-256: $(cut -d' ' -f1 SHA256SUMS). Install with the command in the README; it verifies this digest."
